name: Regenerate practice SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/seo-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: practice-seo-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site and SEO
        run: python tools/build_site.py

      - name: Run SEO regression audit
        run: python tools/seo_audit.py

      - name: Run internal link and asset audit
        run: python tools/link_audit.py

      - name: Run advertising-sensitive wording audit
        run: python tools/content_compliance_audit.py

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faaliyet-alanlari en kvkk sitemap.xml robots.txt index.html hakkimizda uzmanlik-alanlari makaleler iletisim
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore: regenerate bilingual SEO pages'
          git push
