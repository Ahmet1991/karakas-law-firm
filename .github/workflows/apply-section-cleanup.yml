name: Apply section cleanup

on:
  push:
    branches:
      - chore/remove-articles-and-draft-notices-20261016

permissions:
  contents: write

concurrency:
  group: remove-articles-cleanup
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup migration
        run: python .github/scripts/apply_remove_articles_cleanup.py
      - name: Regenerate site metadata and generated pages
        run: python tools/build_site.py
      - name: Run SEO audit (baseline warning allowed)
        continue-on-error: true
        run: python tools/seo_audit.py
      - name: Run link audit
        run: python tools/link_audit.py
      - name: Run content compliance audit
        run: python tools/content_compliance_audit.py
      - name: Run site integrity regression check
        run: python tools/site_integrity_test.py
      - name: Commit cleanup result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore: remove articles and publish privacy notices'
          git push
