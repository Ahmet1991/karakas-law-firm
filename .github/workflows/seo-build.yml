name: Regenerate practice SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/seo-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice-seo-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site and SEO
        run: python tools/build_site.py

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add faaliyet-alanlari en/practice-areas kvkk en/privacy sitemap.xml robots.txt index.html en/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore: regenerate practice SEO pages'
          git push
