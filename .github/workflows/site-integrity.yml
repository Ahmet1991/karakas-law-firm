name: Site integrity

on:
  push:
    branches:
      - main
      - chore/remove-articles-and-draft-notices-20261016
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check removed sections and privacy notice state
        run: python tools/site_integrity_test.py
